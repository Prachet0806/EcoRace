# EcoRace Planner — Render Blueprint (backend only; frontend deploys on Vercel).
# Apply via "New +" → "Blueprint" in the Render dashboard, or `render blueprint launch`.
# Single-instance SQLite: the database and its WAL live on a persistent disk.
# Do not mount over /app/data; that directory contains baked-in reference data.

services:
  - type: web
    name: ecorace-api
    runtime: docker
    # Persistent disks are unavailable on Render's free web plan. The solver
    # also needs more than 512 MB for larger calendars.
    plan: 1c-2g
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    disk:
      name: ecorace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Set in the Render dashboard after the Vercel app exists
      # (NEXT_PUBLIC_ECORACE_API_URL on Vercel must point back here).
      - key: ECORACE_CORS_ORIGINS
        sync: false
      - key: ECORACE_CORS_ALLOW_LAN
        value: "0"
      - key: SOLVER_TIMEOUT_SECONDS
        value: "45"
      - key: SOLVER_MAX_CONCURRENT
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # Baked into the Dockerfile already; listed here to pin the contract.
      - key: ECORACE_DB_PATH
        value: /var/data/ecorace.db
      - key: ECORACE_REQUIRE_PERSISTENT_DB
        value: "1"
      - key: ECORACE_DB_MOUNT
        value: /var/data
