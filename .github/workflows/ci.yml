name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - run: python -m pytest backend/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t ecorace-api:ci .
      - name: Stateless container smoke test
        run: |
          set -euo pipefail
          trap 'docker rm -f ecorace-ci >/dev/null 2>&1 || true' EXIT

          # 1. Run container without any volume or persistent storage
          docker run -d --name ecorace-ci -p 18000:8000 ecorace-api:ci

          # 2. Wait for health endpoint
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18000/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18000/api/v1/health | jq -e '.status == "ok"'

          # 3. Query reference data
          ids=$(curl -fsS http://localhost:18000/api/v1/circuits | jq -c '[.circuits[:20][] | .id]')
          test "$(echo "$ids" | jq 'length')" -eq 20

          # 4. Run optimization
          payload=$(jq -n --argjson ids "$ids" '{race_count:20,circuit_ids:$ids,season_year:2026,budget_s:5}')
          run_result=$(curl -fsS -H 'content-type: application/json' -d "$payload" http://localhost:18000/api/v1/optimization/runs)
          run_id=$(echo "$run_result" | jq -er '.run_id')
          test -n "$run_id"
          test "$(echo "$run_result" | jq -r '.calendar.race_count')" -eq 20

          # Verify run retrieval returns 404 (stateless: backend does not retain run history)
          status_code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18000/api/v1/optimization/runs/$run_id")
          test "$status_code" -eq 404

          # 5. Invalid request handling
          invalid_payload=$(jq -n '{race_count:20,circuit_ids:["nonexistent"],season_year:2026}')
          invalid_status=$(curl -s -o /dev/null -w "%{http_code}" -H 'content-type: application/json' -d "$invalid_payload" http://localhost:18000/api/v1/optimization/runs)
          test "$invalid_status" -ge 400 -a "$invalid_status" -lt 500

          # 6. Restart container (simulates restart/redeploy without volume)
          docker restart ecorace-ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18000/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18000/api/v1/health | jq -e '.status == "ok"'

          # 7. New optimization after restart
          new_run_result=$(curl -fsS -H 'content-type: application/json' -d "$payload" http://localhost:18000/api/v1/optimization/runs)
          new_run_id=$(echo "$new_run_result" | jq -er '.run_id')
          test -n "$new_run_id"
          test "$new_run_id" != "$run_id"
