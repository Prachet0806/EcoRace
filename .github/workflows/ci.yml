name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - run: python -m pytest backend/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t ecorace-api:ci .
      - name: Container and persistence smoke
        run: |
          set -euo pipefail
          docker volume create ecorace-ci-data
          trap 'docker rm -f ecorace-ci >/dev/null 2>&1 || true; docker volume rm ecorace-ci-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name ecorace-ci -p 18000:8000 -v ecorace-ci-data:/var/data -e ECORACE_REQUIRE_PERSISTENT_DB=1 ecorace-api:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18000/api/v1/health | jq -e '.status == "ok"'
          ids=$(curl -fsS http://localhost:18000/api/v1/circuits | jq -c '[.circuits[:20][] | .id]')
          test "$(echo "$ids" | jq 'length')" -eq 20
          payload=$(jq -n --argjson ids "$ids" '{race_count:20,circuit_ids:$ids,season_year:2026,budget_s:9}')
          key=$(python -c 'import uuid; print(uuid.uuid4())')
          run_id=$(curl -fsS -H 'content-type: application/json' -H "Idempotency-Key: $key" -d "$payload" http://localhost:18000/api/v1/optimization/runs | jq -er '.run_id')
          repeated=$(curl -fsS -H 'content-type: application/json' -H "Idempotency-Key: $key" -d "$payload" http://localhost:18000/api/v1/optimization/runs | jq -er '.run_id')
          test "$run_id" = "$repeated"
          curl -sS --max-time 60 -o /tmp/ecorace-load-a.json -w '%{http_code}' -H 'content-type: application/json' -d "$payload" http://localhost:18000/api/v1/optimization/runs > /tmp/ecorace-load-a.status &
          first_pid=$!
          curl -sS --max-time 60 -o /tmp/ecorace-load-b.json -w '%{http_code}' -H 'content-type: application/json' -d "$payload" http://localhost:18000/api/v1/optimization/runs > /tmp/ecorace-load-b.status &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          test "$(sort /tmp/ecorace-load-{a,b}.status | tr '\n' ' ')" = '200 503 '
          jq -s -e 'any(.[]; .error.code? == "SOLVER_OVERLOADED")' /tmp/ecorace-load-*.json
          docker exec ecorace-ci python -m ecorace.infrastructure.db_admin backup /var/data/ecorace.db /var/data/recovery.db
          docker exec ecorace-ci python -m ecorace.infrastructure.db_admin check /var/data/recovery.db --strict | jq -e '.runs >= 1'
          docker rm -f ecorace-ci
          docker run -d --name ecorace-ci -p 18000:8000 -v ecorace-ci-data:/var/data -e ECORACE_DB_PATH=/var/data/recovery.db -e ECORACE_REQUIRE_PERSISTENT_DB=1 ecorace-api:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://localhost:18000/api/v1/optimization/runs/$run_id" | jq -e --arg id "$run_id" '.run_id == $id'
